<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Formel-Fit ESA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: das Rechenblatt als Spielfeld. Lernpfad = Zeilen eines Arbeitsblatts, Aufgaben = echte Mini-Tabellen mit Bearbeitungsleiste und Ausfüllkästchen. */
:root{
  --paper:#F5F8F6; --sheet:#FFFFFF; --ink:#132B2A; --muted:#55706B;
  --grid:#D3DED9; --grid-soft:#E7EEEA; --head:#EBF1EE;
  --accent:#167452; --accent-ink:#FFFFFF; --accent-soft:#DCEFE6;
  --mark:#E7A817; --mark-soft:#FCF0CF; --mark-ink:#3A2A00;
  --good:#167452; --good-soft:#DCEFE6; --bad:#C2412F; --bad-soft:#FBE3DE;
  --shadow:0 1px 0 rgba(19,43,42,.06),0 6px 20px -10px rgba(19,43,42,.25);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1716; --sheet:#152120; --ink:#E4EEEA; --muted:#93ABA5;
  --grid:#2A3B39; --grid-soft:#1D2B29; --head:#1B2826;
  --accent:#4FC796; --accent-ink:#06261A; --accent-soft:#163A2D;
  --mark:#F2C14E; --mark-soft:#3A2F12; --mark-ink:#2A1E00;
  --good:#4FC796; --good-soft:#163A2D; --bad:#F08270; --bad-soft:#3E1D18;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1716; --sheet:#152120; --ink:#E4EEEA; --muted:#93ABA5;
  --grid:#2A3B39; --grid-soft:#1D2B29; --head:#1B2826;
  --accent:#4FC796; --accent-ink:#06261A; --accent-soft:#163A2D;
  --mark:#F2C14E; --mark-soft:#3A2F12; --mark-ink:#2A1E00;
  --good:#4FC796; --good-soft:#163A2D; --bad:#F08270; --bad-soft:#3E1D18;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
code,.mono{font-family:var(--f-mono);font-size:.88em}
code{background:var(--head);border:1px solid var(--grid);border-radius:5px;padding:.05em .35em;white-space:nowrap}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Kopfleiste */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--grid)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.brand .cell{font-family:var(--f-mono);font-size:.72rem;font-weight:600;border:2px solid var(--accent);color:var(--accent);padding:1px 6px;border-radius:3px;position:relative}
.brand .cell::after{content:"";position:absolute;right:-5px;bottom:-5px;width:6px;height:6px;background:var(--accent);border:1px solid var(--sheet)}
.brand .niv{font-family:var(--f-mono);font-size:.75rem;font-weight:600;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:2px 6px}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:999px;font-weight:700;font-size:.92rem}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.xpbox{display:flex;align-items:center;gap:10px;font-size:.85rem}
.xpbox .lvl{font-weight:700}
.xpbar{width:110px;height:8px;border-radius:99px;background:var(--grid-soft);overflow:hidden;border:1px solid var(--grid)}
.xpbar i{display:block;height:100%;background:var(--mark);transition:width .5s ease}
.xpnum{font-family:var(--f-mono);font-weight:600;background:var(--mark-soft);color:var(--ink);border-radius:6px;padding:2px 8px;font-variant-numeric:tabular-nums}
@media (max-width:640px){.xpbar{display:none}.nav{margin-left:0;order:3;width:100%}.xpbox{margin-left:auto}}

main{padding-block:28px 64px}

/* Startseite */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:32px;align-items:center;margin-bottom:40px}
.hero h1{font-size:clamp(2.2rem,5.5vw,3.6rem);font-weight:800;letter-spacing:-.025em}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{font-size:1.1rem;color:var(--muted);margin-top:14px;max-width:34em}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.demo{background:var(--sheet);border:1px solid var(--grid);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;min-width:0}
.demo .cap{font-size:.78rem;color:var(--muted);padding:8px 12px;border-top:1px solid var(--grid);background:var(--head)}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--grid);background:var(--sheet);border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink);font-size:.95rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-head h2{font-size:1.5rem}
.sec-head p{color:var(--muted);font-size:.95rem}

/* Lernpfad als Arbeitsblatt */
.path{background:var(--sheet);border:1px solid var(--grid);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.prow{display:grid;grid-template-columns:44px minmax(0,1.3fr) minmax(0,1.4fr) 150px 64px;align-items:center;border-top:1px solid var(--grid);text-decoration:none;color:inherit;min-height:64px}
.prow:first-child{border-top:0}
.prow.head{min-height:30px;background:var(--head);font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.06em}
.prow.head > div{padding:6px 12px;border-left:1px solid var(--grid);text-align:center}
.prow > div{padding:10px 14px;min-width:0}
.prow .rn{align-self:stretch;display:flex;align-items:center;justify-content:center;background:var(--head);border-right:1px solid var(--grid);font-family:var(--f-mono);font-size:.8rem;color:var(--muted);padding:0}
.prow.head .rn{border-left:0}
a.prow:hover{background:var(--accent-soft)}
a.prow:hover .rn{color:var(--accent)}
.prow .t{font-family:var(--f-display);font-weight:600;font-size:1.08rem;line-height:1.2}
.prow .ctx{color:var(--muted);font-size:.92rem;line-height:1.35}
.prog{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .bar{flex:1;height:8px;border-radius:99px;background:var(--grid-soft);overflow:hidden;border:1px solid var(--grid)}
.prog .bar i{display:block;height:100%;background:var(--accent)}
.prow.final .t{color:var(--accent)}
@media (max-width:720px){
  .prow{grid-template-columns:40px minmax(0,1fr) 56px}
  .prow.head{display:none}
  .prow .ctx-col{display:none}
  .prow .prog-col{grid-column:2;padding-top:0}
  .prow .badge-col{grid-row:1/span 2;grid-column:3}
  .prow .rn{grid-row:1/span 2}
}

/* Abzeichen */
.seal{--c:var(--grid);width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.82rem;border:2px dashed var(--c);color:var(--muted);margin:auto;position:relative}
.seal.on{--c:var(--mark);border-style:solid;background:var(--mark-soft);color:var(--ink);box-shadow:inset 0 0 0 3px var(--sheet)}
.seal.big{width:84px;height:84px;font-size:1.35rem;border-width:3px}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:40px}
.card{background:var(--sheet);border:1px solid var(--grid);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{font-size:1.15rem}
.card p,.card li{color:var(--muted);font-size:.95rem}
.card ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.badges{display:flex;flex-wrap:wrap;gap:10px}
.badges .b{display:flex;flex-direction:column;align-items:center;gap:4px;width:74px;text-align:center;font-size:.7rem;color:var(--muted);line-height:1.2}

/* Station */
.crumb{display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;font-weight:700;font-size:.9rem;margin-bottom:14px}
.crumb:hover{color:var(--accent)}
.st-head{display:flex;gap:18px;align-items:flex-start;margin-bottom:24px;flex-wrap:wrap}
.st-head .num{font-family:var(--f-mono);font-size:.78rem;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.st-head h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;letter-spacing:-.02em;margin-top:4px}
.st-head .story{color:var(--muted);margin-top:10px;max-width:42em}
.st-head > div{flex:1;min-width:0}
.st-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.st-grid{grid-template-columns:minmax(0,1fr)}}
.merke{background:var(--sheet);border:1px solid var(--grid);border-radius:var(--r);padding:18px 18px 18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:900px){.merke{position:static}}
.merke h2{font-size:.78rem;font-family:var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.merke ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.merke li{font-size:.95rem;line-height:1.45;padding-left:14px;position:relative}
.merke li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;background:var(--accent)}
.merke .ex{margin-top:14px;padding:10px 12px;background:var(--head);border-radius:8px;font-family:var(--f-mono);font-size:.82rem;line-height:1.6;overflow-x:auto}
.merke .ex b{color:var(--accent);font-weight:600}

.stepper{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.stepper button{width:36px;height:30px;border:1px solid var(--grid);background:var(--sheet);border-radius:6px;font-family:var(--f-mono);font-size:.8rem;cursor:pointer;color:var(--muted)}
.stepper button.done{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.stepper button.cur{border:2px solid var(--accent);color:var(--ink);font-weight:600}
.stepper .lbl{margin-left:auto;font-size:.85rem;color:var(--muted)}

.task{background:var(--sheet);border:1px solid var(--grid);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px;min-width:0}
.task-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.78rem;font-family:var(--f-mono);color:var(--muted)}
.chip{border:1px solid var(--grid);border-radius:99px;padding:1px 9px;background:var(--head)}
.chip.xp{background:var(--mark-soft);border-color:transparent;color:var(--ink);font-weight:600}
.task h3{font-family:var(--f-body);font-weight:700;font-size:1.12rem;line-height:1.45}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1.5px solid var(--grid);background:var(--sheet);border-radius:8px;padding:11px 14px;cursor:pointer;font-size:1rem;line-height:1.4}
.opt .k{flex:none;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--head);font-family:var(--f-mono);font-size:.8rem;font-weight:600}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.numin{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numin input{font:600 1.1rem var(--f-mono);width:180px;max-width:100%;padding:9px 12px;border:1.5px solid var(--grid);border-radius:8px;background:var(--sheet);color:var(--ink)}
.numin input:focus{border-color:var(--accent);outline:none}
.fb{border-radius:8px;padding:12px 14px;font-size:.98rem;line-height:1.45;display:flex;gap:10px;align-items:flex-start}
.fb .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.8rem;color:var(--sheet)}
.fb.ok{background:var(--good-soft)} .fb.ok .ic{background:var(--good)}
.fb.no{background:var(--bad-soft)} .fb.no .ic{background:var(--bad)}
.fb.tip{background:var(--mark-soft)} .fb.tip .ic{background:var(--mark);color:var(--mark-ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions .sp{flex:1}
.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.shake{animation:shake .35s ease}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.pop,.shake{animation:none}.xpbar i{transition:none}}

/* Mini-Tabelle */
.sheet{border:1px solid var(--grid);border-radius:8px;overflow:hidden;background:var(--sheet);min-width:0}
.fbar{display:flex;align-items:stretch;border-bottom:1px solid var(--grid);background:var(--sheet)}
.namebox{font-family:var(--f-mono);font-size:.85rem;font-weight:600;padding:8px 10px;border-right:1px solid var(--grid);min-width:56px;text-align:center;background:var(--head)}
.fx{font-family:var(--f-mono);font-style:italic;color:var(--muted);padding:8px 10px;border-right:1px solid var(--grid)}
.finput{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 16px var(--f-mono);padding:8px 10px}
.finput:focus{outline:none;background:var(--accent-soft)}
.keys{display:flex;gap:4px;flex-wrap:wrap;padding:6px 8px;border-bottom:1px solid var(--grid);background:var(--head)}
.keys button{font-family:var(--f-mono);font-size:.82rem;min-width:32px;padding:3px 8px;border:1px solid var(--grid);background:var(--sheet);border-radius:5px;cursor:pointer}
.keys button:hover{border-color:var(--accent)}
.keys .hint{font-size:.72rem;color:var(--muted);align-self:center;margin-left:auto}
.gridwrap{overflow-x:auto}
table.g{border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums;min-width:100%}
table.g th{background:var(--head);color:var(--muted);font:500 .74rem var(--f-mono);border:1px solid var(--grid);padding:3px 6px;text-align:center}
table.g th.rh{width:38px}
table.g th.on{color:var(--accent);background:var(--accent-soft)}
table.g td{border:1px solid var(--grid-soft);padding:5px 8px;height:31px;white-space:nowrap;position:relative;user-select:none}
table.g td.n{text-align:right}
table.g td.e{text-align:center;color:var(--bad);font-family:var(--f-mono);font-size:.8rem}
table.g td.fml{color:var(--ink)}
table.g td.lbl{font-weight:700}
table.g.clickable td{cursor:pointer}
table.g.clickable td:hover{background:var(--accent-soft)}
table.g td.zone{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--grid-soft) 6px 7px)}
table.g td.sel{outline:2px solid var(--accent);outline-offset:-2px;background:var(--sheet)}
table.g td.sel::after{content:"";position:absolute;right:-4px;bottom:-4px;width:7px;height:7px;background:var(--accent);border:1px solid var(--sheet);z-index:1}
table.g td.prev{color:var(--muted);font-style:italic}
table.g td.ok{background:var(--good-soft)}
table.g td.bad{background:var(--bad-soft)}
table.g td.pick{outline:2px solid var(--mark);outline-offset:-2px;background:var(--mark-soft)}
table.g td.refhl{background:var(--accent-soft)}

.chart{background:var(--sheet);border:1px solid var(--grid);border-radius:8px;padding:10px;overflow-x:auto}
.chart svg{display:block;width:100%;max-width:560px;height:auto;margin:auto}

/* Abschluss */
.done-panel{display:flex;gap:20px;align-items:center;background:var(--mark-soft);border-radius:var(--r);padding:22px;flex-wrap:wrap}
.done-panel > div{flex:1;min-width:220px}
.done-panel h3{font-size:1.4rem}
.done-panel p{margin-top:6px}

/* Test */
.test-intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.test-intro{grid-template-columns:minmax(0,1fr)}}
.tprog{display:flex;gap:3px;margin-bottom:14px}
.tprog i{flex:1;height:6px;border-radius:3px;background:var(--grid-soft);border:1px solid var(--grid)}
.tprog i.ans{background:var(--accent-soft);border-color:var(--accent)}
.tprog i.cur{background:var(--accent);border-color:var(--accent)}
.score{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.score .big{font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.score .big small{font-size:1.4rem;color:var(--muted)}
.topics{display:grid;gap:6px;margin-top:6px}
.topic{display:grid;grid-template-columns:minmax(0,1fr) 70px auto;gap:12px;align-items:center;font-size:.95rem;padding:8px 0;border-top:1px solid var(--grid-soft)}
.topic .dots{display:flex;gap:4px;justify-content:flex-end}
.topic .dots i{width:14px;height:14px;border-radius:3px;background:var(--bad-soft);border:1px solid var(--bad)}
.topic .dots i.y{background:var(--good);border-color:var(--good)}
.review{display:flex;flex-direction:column;gap:8px}
.review details{background:var(--sheet);border:1px solid var(--grid);border-radius:8px;padding:10px 14px}
.review summary{cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:700}
.review summary .m{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;color:var(--sheet)}
.review summary .m.y{background:var(--good)} .review summary .m.n{background:var(--bad)}
.review .body{margin-top:10px;display:flex;flex-direction:column;gap:8px;font-size:.95rem}
.muted{color:var(--muted)}
.foot{margin-top:48px;color:var(--muted);font-size:.85rem;border-top:1px solid var(--grid);padding-top:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:99px;font-weight:700;font-size:.95rem;z-index:60;box-shadow:var(--shadow)}
</style>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#start"><span class="cell">A1</span>Formel-Fit <span class="niv">ESA</span></a>
    <div class="xpbox" aria-live="polite">
      <span class="lvl" id="lvlName">Zellen-Neuling</span>
      <span class="xpbar" aria-hidden="true"><i id="xpFill" style="width:0"></i></span>
      <span class="xpnum" id="xpNum">0 XP</span>
    </div>
    <nav class="nav">
      <a href="#start" id="navPath">Lernpfad</a>
      <a href="#test" id="navTest">Übungstest</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<canvas id="confetti" hidden></canvas>

<script>
const NIVEAU='ESA';
/* =========================================================

const addrOf=(c,r)=>numToCol(c)+r;
function rangeCells(a,b){const A=parseAddr(a),B=parseAddr(b),out=[];

const ALIAS={SUM:'SUMME',AVERAGE:'MITTELWERT',COUNT:'ANZAHL',COUNTA:'ANZAHL2',IF:'WENN',ROUND:'RUNDEN',COUNTIF:'ZÄHLENWENN',ZAEHLENWENN:'ZÄHLENWENN',SQRT:'WURZEL',POWER:'POTENZ',MODE:'MODUS','MODUS.EINF':'MODUS','MODE.SNGL':'MODUS'};
function tokenize(src){

    if((m=/^\d+(?:[.,]\d+)?/.exec(rest))){t.push({t:'num',v:parseFloat(m[0].replace(',','.'))});i+=m[0].length;continue}
    if((m=/^[A-Za-zÄÖÜäöü_][A-Za-zÄÖÜäöü0-9_.]*/.exec(rest))){

      else if(w==='FALSCH'||w==='FALSE')t.push({t:'bool',v:false});
      else t.push({t:'name',v:w});
      continue}
    const two=src.substr(i,2);
    if(two==='<='||two==='>='||two==='<>'){t.push({t:'op',v:two});i+=2;continue}
    if('+-*/^&=<>%():;'.includes(ch)){t.push({t:'op',v:ch});i++;continue}
    if(ch===','){t.push({t:'op',v:';'});i++;continue}
    throw new PErr('Zeichen '+ch);
  }

}
function parse(src){
  const toks=tokenize(src);let p=0;
  const peek=()=>toks[p],next=()=>toks[p++];
  const isOp=v=>peek()&&peek().t==='op'&&peek().v===v;
  const expect=v=>{if(!isOp(v))throw new PErr('erwartet '+v);p++};
  const CMP=['=','<>','<','>','<=','>='];
  function comparison(){let l=concat();while(peek()&&peek().t==='op'&&CMP.includes(peek().v)){const op=next().v;l={k:'bin',op,l,r:concat()}}return l}
  function concat(){let l=additive();while(isOp('&')){p++;l={k:'bin',op:'&',l,r:additive()}}return l}
  function additive(){let l=mult();while(isOp('+')||isOp('-')){const op=next().v;l={k:'bin',op,l,r:mult()}}return l}
  function mult(){let l=power();while(isOp('*')||isOp('/')){const op=next().v;l={k:'bin',op,l,r:power()}}return l}
  function power(){let l=unary();while(isOp('^')){p++;l={k:'bin',op:'^',l,r:unary()}}return l}
  function unary(){if(isOp('-')){p++;return{k:'neg',e:unary()}}if(isOp('+')){p++;return unary()}return postfix()}
  function postfix(){let e=primary();while(isOp('%')){p++;e={k:'pct',e}}return e}
  function primary(){
    const t=next();if(!t)throw new PErr('Ende');
    if(t.t==='num')return{k:'num',v:t.v};
    if(t.t==='str')return{k:'str',v:t.v};
    if(t.t==='bool')return{k:'bool',v:t.v};
    if(t.t==='ref'){if(isOp(':')){p++;const b=next();if(!b||b.t!=='ref')throw new PErr('Bereich');return{k:'range',a:t.v,b:b.v}}return{k:'ref',a:t.v}}
    if(t.t==='func'){expect('(');const args=[];if(isOp(')')){p++;return{k:'fn',n:t.v,args}}
      for(;;){if(isOp(';')||isOp(')'))args.push({k:'empty'});else args.push(comparison());if(isOp(';')){p++;continue}expect(')');break}
      return{k:'fn',n:t.v,args}}
    if(t.t==='name')return{k:'name',v:t.v};
    if(t.t==='op'&&t.v==='('){const e=comparison();expect(')');return e}
    throw new PErr('unerwartet');
  }
  const ast=comparison();if(p<toks.length)throw new PErr('Rest');return ast;
}
function toNum(v){
  if(isErr(v))return v;if(v===null||v===undefined)return 0;if(typeof v==='number')return v;if(typeof v==='boolean')return v?1:0;
  const s=String(v).trim().replace(',','.');if(s!==''&&!isNaN(+s))return +s;return E('#WERT!');
}
function toStr(v){if(v===null||v===undefined)return'';if(typeof v==='boolean')return v?'WAHR':'FALSCH';if(typeof v==='number')return String(+v.toPrecision(12)).replace('.',',');return String(v)}
const sc=v=>(v&&v.range)?E('#WERT!'):v;
function flat(args){const out=[];
  for(const a of args){
    if(a&&a.range){for(const v of a.range){if(isErr(v))return v;if(typeof v==='number')out.push(v)}}
    else{if(isErr(a))return a;if(a===null)continue;const n=toNum(a);if(isErr(n))return n;out.push(n)}
  }return out}
function compare(a,b,op){
  if(a===null)a=(typeof b==='string')?'':0; if(b===null)b=(typeof a==='string')?'':0;
  let c;
  if(typeof a==='string'&&typeof b==='string'){const x=a.toLowerCase(),y=b.toLowerCase();c=x<y?-1:x>y?1:0}
  else if(typeof a==='string')c=1; else if(typeof b==='string')c=-1;
  else{const x=toNum(a),y=toNum(b);c=Math.abs(x-y)<1e-12?0:(x<y?-1:1)}
  return{'=':c===0,'<>':c!==0,'<':c<0,'>':c>0,'<=':c<=0,'>=':c>=0}[op];
}
const FUNCS={
  SUMME:a=>{const n=flat(a);return isErr(n)?n:n.reduce((s,x)=>s+x,0)},
  MITTELWERT:a=>{const n=flat(a);if(isErr(n))return n;return n.length?n.reduce((s,x)=>s+x,0)/n.length:E('#DIV/0!')},
  MIN:a=>{const n=flat(a);if(isErr(n))return n;return n.length?Math.min(...n):0},
  MAX:a=>{const n=flat(a);if(isErr(n))return n;return n.length?Math.max(...n):0},
  MEDIAN:a=>{const n=flat(a);if(isErr(n))return n;if(!n.length)return E('#ZAHL!');const s=[...n].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2},
  MODUS:a=>{const n=flat(a);if(isErr(n))return n;const c=new Map();let best=null,bc=1;for(const x of n){const k=c.get(x)||0;c.set(x,k+1);if(k+1>bc){bc=k+1;best=x}}return best===null?E('#NV'):best},
  ANZAHL:a=>{let c=0;for(const x of a){if(x&&x.range){for(const v of x.range)if(typeof v==='number')c++}else if(typeof x==='number')c++}return c},
  ANZAHL2:a=>{let c=0;for(const x of a){if(x&&x.range){for(const v of x.range)if(v!==null&&v!=='')c++}else if(x!==null)c++}return c},
  RUNDEN:a=>{const x=toNum(sc(a[0])),d=a.length>1?toNum(sc(a[1])):0;if(isErr(x))return x;if(isErr(d))return d;const p=10**Math.trunc(d);return Math.sign(x)*Math.round(Math.abs(x)*p+1e-9)/p},
  ABS:a=>{const x=toNum(sc(a[0]));return isErr(x)?x:Math.abs(x)},
  WURZEL:a=>{const x=toNum(sc(a[0]));if(isErr(x))return x;return x<0?E('#ZAHL!'):Math.sqrt(x)},
  POTENZ:a=>{const x=toNum(sc(a[0])),y=toNum(sc(a[1]));if(isErr(x))return x;if(isErr(y))return y;return x**y},
  'ZÄHLENWENN':a=>{const r=a[0];if(!r||!r.range)return E('#WERT!');let cr=sc(a[1]);let op='=',val=cr;
    if(typeof cr==='string'){const m=/^(<=|>=|<>|<|>|=)?(.*)$/.exec(cr);op=m[1]||'=';val=m[2];const n=toNum(val);if(!isErr(n)&&val.trim()!=='')val=n}

};
function evalNode(n,get){
  switch(n.k){
    case'num':case'str':case'bool':return n.v;
    case'empty':return null;
    case'ref':return get(n.a);
    case'range':return{range:rangeCells(n.a.replace(/\$/g,''),n.b.replace(/\$/g,'')).map(get)};
    case'name':return E('#NAME?');
    case'neg':{const v=toNum(sc(evalNode(n.e,get)));return isErr(v)?v:-v}
    case'pct':{const v=toNum(sc(evalNode(n.e,get)));return isErr(v)?v:v/100}
    case'fn':{
      if(n.n==='WENN'){
        if(n.args.length<2)return E('#WERT!');
        const c=sc(evalNode(n.args[0],get));if(isErr(c))return c;
        let truth;if(typeof c==='boolean')truth=c;else if(typeof c==='string')return E('#WERT!');else truth=toNum(c)!==0;

      }

    }
  }

}
function makeEval(cells){
  const cache={},visiting=new Set();
  function get(a){
    a=String(a).replace(/\$/g,'').toUpperCase();
    if(a in cache)return cache[a];
    const raw=cells[a];let v;
    if(raw===undefined||raw===null||raw==='')v=null;
    else if(typeof raw==='string'&&raw[0]==='='){
      if(visiting.has(a))return E('#ZIRKEL!');
      visiting.add(a);
      try{v=evalNode(parse(raw.slice(1)),get);if(v&&v.range)v=E('#WERT!');if(v===null)v=0}
      catch(e){v=E('#FEHLER')}
      visiting.delete(a);
    }else v=raw;
    cache[a]=v;return v;
  }
  return get;
}
function shiftFormula(f,dr,dc){
  return f.split(/("[^"]*")/).map((part,i)=>i%2?part:part.replace(/(^|[^A-Za-zÄÖÜäöü0-9_$.])(\$?)([A-Za-z]{1,3})(\$?)(\d+)(?![A-Za-z0-9(.])/g,(m,pre,d1,col,d2,row)=>{
    let c=colToNum(col.toUpperCase()),r=+row;if(!d1)c+=dc;if(!d2)r+=dr;
    return pre+d1+numToCol(c)+d2+r;})).join('');
}
function normFormula(s){return String(s||'').trim().replace(/[„“”″]/g,'"').replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-')}
function place(cells,targets,formula){
  const o=Object.assign({},cells),a0=parseAddr(targets[0]);
  targets.forEach(t=>{const a=parseAddr(t);o[t]=shiftFormula(formula,a.r-a0.r,a.c-a0.c)});return o;
}
function same(a,b,acc100){
  if(isErr(a)||isErr(b))return isErr(a)&&isErr(b)&&a.err===b.err;
  if(typeof b==='number'){if(typeof a!=='number')return false;const tol=1e-6*Math.max(1,Math.abs(b));return Math.abs(a-b)<=tol||(acc100&&Math.abs(a-b*100)<=tol*100)}
  if(typeof b==='string')return typeof a==='string'&&a.trim().toLowerCase()===b.trim().toLowerCase();
  return a===b;
}

   {type:'formula',q:'Wie viel kostet die Jugendherberge für alle Teilnehmenden? Gib in C5 eine Formel ein: Preis pro Person mal Anzahl der Teilnehmenden.',cell:'C5',expect:'=B5*B2',hint:'Multipliziere die Zelle mit dem Preis (B5) mit der Zelle mit der Teilnehmerzahl (B2). Das Malzeichen ist <code>*</code>.'},
   {type:'mc',q:'Excel rechnet nach den Regeln der Mathematik. Welchen Wert liefert <code>=2+3*4</code>?',opts:['14','20','24','9'],a:0,explain:'Punkt vor Strich: Erst 3 · 4 = 12, dann 2 + 12 = 14.'},
   {type:'formula',q:'Die Kosten der anderen Posten stehen schon da. Addiere in C9 alle Kosten mit dem Pluszeichen.',cell:'C9',expect:'=C5+C6+C7+C8',pre:[['C5','=B5*$B$2','C8']],hint:'Verbinde die Zellen C5, C6, C7 und C8 mit <code>+</code>.'},
   {type:'formula',q:'Wie viel muss jede Person zahlen? Berechne in C10 die Kosten pro Person.',cell:'C10',expect:'=C9/B2',pre:[['C5','=B5*$B$2','C8'],['C9','=SUMME(C5:C8)']],hint:'Teile die Gesamtkosten (C9) durch die Anzahl der Teilnehmenden (B2). Das Geteiltzeichen ist <code>/</code>.'},
   {type:'mc',q:'Tom tippt in C10 <code>=C5+C6+C7+C8/B2</code> und bekommt ein viel zu großes Ergebnis. Warum?',opts:['Wegen Punkt vor Strich wird nur C8 durch B2 geteilt. Es fehlen Klammern.','Excel kann nicht durch eine Zelle teilen.','Das Geteiltzeichen in Excel ist der Doppelpunkt.','Die Formel muss mit SUMME beginnen.'],a:0,pre:[['C5','=B5*$B$2','C8'],['C9','=SUMME(C5:C8)']],explain:'Richtig wäre <code>=(C5+C6+C7+C8)/B2</code>. Die Klammer sorgt dafür, dass zuerst addiert wird.'}
  ]},
{ id:'summe', title:'SUMME und ANZAHL', glyph:'Σ', badge:'Summen-Sammler', ctx:'Pausenkiosk der Schülerfirma',
  story:'Eure Schülerfirma betreibt den Pausenkiosk. Am Donnerstag war Wandertag, da blieb der Kiosk zu. Wie viel wurde in der Woche verkauft?',
  merke:['<code>=SUMME(B2:B6)</code> addiert alle Zahlen im Bereich B2 bis B6.','Mehrere Bereiche trennst du mit Semikolon: <code>=SUMME(B2:B4;C2:C4)</code>.','<code>=ANZAHL(B2:B6)</code> zählt, wie viele Zellen eine Zahl enthalten. Text und leere Zellen zählen nicht.','Schnell: Mit der Schaltfläche Σ (AutoSumme) fügt Excel SUMME automatisch ein.'],
  ex:'<b>=SUMME(B2:B6)</b><br><b>=ANZAHL(B2:B6)</b><br><b>=SUMME(B2:B4;C2:C4)</b>',
  sheet:{cells:{A1:'Tag',B1:'Brötchen',C1:'Getränke',A2:'Mo',B2:34,C2:51,A3:'Di',B3:28,C3:47,A4:'Mi',B4:41,C4:56,A5:'Do',B5:'zu',C5:'zu',A6:'Fr',B6:22,C6:39,A7:'Summe',A8:'Verkaufstage'},rows:8,cols:3,lbl:['A1','B1','C1','A7','A8']},
  tasks:[
   {type:'formula',q:'Wie viele Brötchen wurden in der Woche verkauft? Berechne die Summe in B7 mit der Funktion SUMME.',cell:'B7',expect:'=SUMME(B2:B6)',require:['SUMME'],hint:'Schreibe <code>=SUMME(</code>, dann den Bereich von B2 bis B6 mit Doppelpunkt, dann <code>)</code>.'},
   {type:'formula',q:'An wie vielen Tagen war der Kiosk geöffnet? Lass Excel in B8 mit ANZAHL zählen, wie viele Zellen in B2:B6 eine Zahl enthalten.',cell:'B8',expect:'=ANZAHL(B2:B6)',require:['ANZAHL'],pre:[['B7','=SUMME(B2:B6)']],hint:'Genau wie SUMME, nur mit ANZAHL: <code>=ANZAHL(B2:B6)</code>. Die Zelle mit »zu« zählt nicht mit.'},
   {type:'number',q:'Welchen Wert liefert <code>=SUMME(B2:B4;C2:C4)</code>?',answer:'=SUMME(B2:B4;C2:C4)',pre:[['B7','=SUMME(B2:B6)'],['B8','=ANZAHL(B2:B6)']],explain:'Die Formel addiert Brötchen und Getränke von Montag bis Mittwoch: 34 + 28 + 41 + 51 + 47 + 56 = 257.'},
   {type:'mc',q:'Warum ist <code>=SUMME(B2:B6)</code> besser als <code>=34+28+41+22</code>?',opts:['Ändert sich ein Wert in der Tabelle, rechnet die Formel automatisch neu.','SUMME rechnet genauer als das Pluszeichen.','Ohne SUMME zeigt Excel einen Fehler an.','Mit SUMME werden auch Textzellen mitgezählt.'],a:0,pre:[['B7','=SUMME(B2:B6)'],['B8','=ANZAHL(B2:B6)']],explain:'Feste Zahlen in einer Formel aktualisieren sich nie. Mit Zellbezügen bleibt die Tabelle immer richtig.'}
  ]},
{ id:'statistik', title:'MITTELWERT, MEDIAN, MIN und MAX', glyph:'x̄', badge:'Statistik-Spürnase', ctx:'Wie lange bin ich am Handy?',
  story:'Jana will wissen, wie viel Zeit sie wirklich am Handy verbringt. Ihre Bildschirmzeit-App liefert die Minuten pro Tag.',
  merke:['<code>=MITTELWERT(B2:B8)</code> berechnet den Durchschnitt: Summe geteilt durch Anzahl.','<code>=MEDIAN(B2:B8)</code> liefert den mittleren Wert der der Größe nach sortierten Liste.','<code>=MIN(…)</code> und <code>=MAX(…)</code> liefern den kleinsten und größten Wert.','Spannweite = größter Wert minus kleinster Wert: <code>=MAX(…)-MIN(…)</code>.'],
  ex:'<b>=MITTELWERT(B2:B8)</b><br><b>=MAX(B2:B8)-MIN(B2:B8)</b>',
  sheet:{cells:{A1:'Tag',B1:'Minuten',A2:'Mo',B2:185,A3:'Di',B3:142,A4:'Mi',B4:210,A5:'Do',B5:168,A6:'Fr',B6:240,A7:'Sa',B7:315,A8:'So',B8:290,A9:'Mittelwert',A10:'Maximum',A11:NIVEAU==='ESA'?'Minimum':'Spannweite'},rows:11,cols:2,lbl:['A1','B1','A9','A10','A11']},
  tasks:[
   {type:'formula',q:'Wie viele Minuten ist Jana im Durchschnitt pro Tag am Handy? Berechne in B9 den Mittelwert.',cell:'B9',expect:'=MITTELWERT(B2:B8)',require:['MITTELWERT'],hint:'<code>=MITTELWERT(B2:B8)</code> – der Bereich umfasst Montag bis Sonntag.'},
   {type:'formula',q:'Was war Janas längste Handyzeit an einem Tag? Gib in B10 eine Formel ein.',cell:'B10',expect:'=MAX(B2:B8)',require:['MAX'],pre:[['B9','=MITTELWERT(B2:B8)']],hint:'Der größte Wert eines Bereichs: <code>=MAX(…)</code>.'},
   {lv:'ESA',type:'formula',q:'Was war Janas kürzeste Handyzeit an einem Tag? Gib in B11 eine Formel ein.',cell:'B11',expect:'=MIN(B2:B8)',require:['MIN'],pre:[['B9','=MITTELWERT(B2:B8)'],['B10','=MAX(B2:B8)']],hint:'Der kleinste Wert eines Bereichs: <code>=MIN(…)</code>.'},
   {lv:'MSA',type:'formula',q:'Berechne in B11 die Spannweite der Werte.',cell:'B11',expect:'=MAX(B2:B8)-MIN(B2:B8)',require:['MIN'],pre:[['B9','=MITTELWERT(B2:B8)'],['B10','=MAX(B2:B8)']],hint:'Spannweite = größter Wert minus kleinster Wert. Du kannst auch B10 nutzen: <code>=B10-MIN(B2:B8)</code>.'},
   {type:'number',q:'Bestimme den Median der Werte von Montag bis Sonntag (in Minuten).',answer:'=MEDIAN(B2:B8)',pre:[['B9','=MITTELWERT(B2:B8)'],['B10','=MAX(B2:B8)']],explain:'Sortiert: 142, 168, 185, <b>210</b>, 240, 290, 315. Der mittlere (4.) Wert ist 210.'},
   {type:'mc',q:'Der Mittelwert (etwa 221 min) ist größer als der Median (210 min). Woran liegt das?',opts:['Die hohen Werte am Wochenende ziehen den Mittelwert nach oben.','Excel hat sich verrechnet.','Der Median ist immer kleiner als der Mittelwert.','Der Median lässt den Sonntag weg.'],a:0,pre:[['B9','=MITTELWERT(B2:B8)'],['B10','=MAX(B2:B8)']],explain:'Der Mittelwert reagiert auf besonders große Werte. Der Median schaut nur auf die Mitte und bleibt davon unbeeindruckt.'},
   {lv:'MSA',type:'formula',q:'An wie vielen Tagen war Jana mehr als 200 Minuten am Handy? Lass Excel in B12 mit ZÄHLENWENN zählen.',cell:'B12',expect:'=ZÄHLENWENN(B2:B8;">200")',require:['ZÄHLENWENN'],pre:[['B9','=MITTELWERT(B2:B8)'],['B10','=MAX(B2:B8)']],hint:'<code>=ZÄHLENWENN(Bereich;Bedingung)</code>. Die Bedingung steht in Anführungszeichen: <code>">200"</code>.',explain:'Mo 185, Di 142, Mi 210, Do 168, Fr 240, Sa 315, So 290: Viermal liegt der Wert über 200.'}
  ]},
{ id:'bezuege', title:'Relative und absolute Bezüge', glyph:'$', badge:'Dollar-Dompteur', ctx:'Black-Week-Rabatt im Online-Shop',
  story:'In der Black Week gibt es 20 % Rabatt auf alles. Du willst die neuen Preise für deine Wunschliste ausrechnen, aber nur eine Formel schreiben und sie dann herunterziehen.',
  merke:['Ziehst du eine Formel am Ausfüllkästchen nach unten, passen sich die Bezüge an: aus <code>B4</code> wird <code>B5</code>, <code>B6</code> … (relativer Bezug).','Mit <code>$</code> hältst du einen Bezug fest: <code>$B$1</code> bleibt beim Kopieren immer B1 (absoluter Bezug).','<code>$B1</code> hält nur die Spalte fest, <code>B$1</code> nur die Zeile.','Die Taste F4 setzt die $-Zeichen beim Tippen automatisch.'],
  ex:'C4: <b>=B4*$B$1</b><br>C5: =B5*$B$1<br>C6: =B6*$B$1',
  sheet:{cells:{A1:'Rabatt',B1:0.2,A3:'Artikel',B3:'Preis',C3:'Rabatt',D3:'Neuer Preis',A4:'Sneaker',B4:89.99,A5:'Hoodie',B5:49.95,A6:'Kopfhörer',B6:59,A7:'Rucksack',B7:34.5,A8:'Cap',B8:19.99},fmt:{B:'eur',C:'eur',D:'eur',B1:'pct'},rows:8,cols:4,lbl:['A1','A3','B3','C3','D3']},
  tasks:[
   {type:'mc',q:'In C4 steht <code>=B4*2</code>. Du ziehst die Formel eine Zeile nach unten. Welche Formel steht dann in C5?',opts:['=B5*2','=B4*2','=B5*3','=C5*2'],a:0,sheet:false,explain:'Der relative Bezug B4 wandert eine Zeile mit und wird zu B5. Die Zahl 2 bleibt gleich.'},
   {type:'formula',q:'Berechne in C4 den Rabatt in Euro (Preis mal Rabattsatz). Die Formel soll sich bis C8 herunterziehen lassen.',cell:'C4',fill:'C8',expect:'=B4*$B$1',hint:'Preis mal Rabattsatz. Damit B1 beim Herunterziehen nicht zu B2, B3 … verrutscht, schreibe <code>$B$1</code>.'},
   {type:'formula',q:'Berechne in D4 den neuen Preis und ziehe die Formel bis D8.',cell:'D4',fill:'D8',expect:'=B4-C4',pre:[['C4','=B4*$B$1','C8']],hint:'Neuer Preis = alter Preis minus Rabatt. Hier dürfen beide Bezüge mitwandern.'},
   {lv:'ESA',type:'mc',q:'Was bewirkt das $ in <code>=B4*$B$1</code>?',opts:['B1 bleibt beim Herunterziehen immer B1.','Das Ergebnis wird in Euro angezeigt.','B1 wird mit 100 multipliziert.','Die Zelle B1 wird gesperrt und kann nicht mehr geändert werden.'],a:0,sheet:false,explain:'Das $ macht den Bezug absolut. Beim Kopieren bleibt er gleich, während B4 zu B5, B6 … wird.'},
   {lv:'MSA',type:'mc',q:'Welche Schreibweise hält beim Kopieren <em>nur die Zeile</em> fest?',opts:['B$1','$B1','$B$1','B1'],a:0,sheet:false,explain:'Das $ steht vor dem Teil, der festgehalten wird. In B$1 ist es die Zeilennummer 1.'},
   {lv:'MSA',type:'formula',q:'Für die Klassenfahrt-Party verkauft ihr Lose zu verschiedenen Preisen. Gib in B4 eine einzige Formel ein (Anzahl mal Lospreis), die du nach rechts und nach unten bis D7 ziehen kannst.',cell:'B4',fill:'D7',expect:'=$A4*B$3',sheet:{cells:{A2:'Preistabelle Lose',A3:'Anzahl',B3:0.5,C3:1,D3:2,A4:1,A5:2,A6:5,A7:10},fmt:{B:'eur',C:'eur',D:'eur'},rows:7,cols:4,lbl:['A2','A3']},hint:'Die Anzahl steht immer in Spalte A: <code>$A4</code>. Der Preis steht immer in Zeile 3: <code>B$3</code>.',explain:'Gemischte Bezüge: <code>$A4</code> hält die Spalte fest, <code>B$3</code> die Zeile.'}
  ]},
{ id:'wenn', title:'Die WENN-Funktion', glyph:'?', badge:'WENN-Entscheider', ctx:'Mathe-Arbeit: bestanden oder nicht?',
  story:'Herr Yılmaz hat die Mathe-Arbeit korrigiert. Ab 20 von 40 Punkten ist sie bestanden. Das soll die Tabelle automatisch anzeigen.',
  merke:['<code>=WENN(Prüfung;Dann_Wert;Sonst_Wert)</code>','Vergleiche: <code>=</code> <code>&lt;&gt;</code> (ungleich) <code>&lt;</code> <code>&gt;</code> <code>&lt;=</code> <code>&gt;=</code>','Text steht immer in Anführungszeichen: <code>"bestanden"</code>. Zahlen nicht.','»ab 20« heißt <code>&gt;=20</code>, »über 20« heißt <code>&gt;20</code>.'],
  ex:'<b>=WENN(B2>=20;"bestanden";"nicht bestanden")</b>',
  sheet:{cells:{A1:'Name',B1:'Punkte',C1:'Ergebnis',A2:'Emma',B2:27,A3:'Ben',B3:19,A4:'Noah',B4:20,A5:'Lina',B5:34,A6:'Paul',B6:12,A7:'Sofia',B7:23},rows:7,cols:3,w:{C:150},lbl:['A1','B1','C1']},
  tasks:[
   {type:'formula',q:'Gib in C2 eine Formel ein, die »bestanden« oder »nicht bestanden« anzeigt. Ziehe sie bis C7.',cell:'C2',fill:'C7',expect:'=WENN(B2>=20;"bestanden";"nicht bestanden")',require:['WENN'],hint:'<code>=WENN(B2&gt;=20;"bestanden";"nicht bestanden")</code> – die Teile werden durch Semikolons getrennt.'},
   {type:'mc',q:'Noah hat genau 20 Punkte. Was liefert <code>=WENN(B4&gt;20;"bestanden";"nicht bestanden")</code>?',opts:['nicht bestanden','bestanden','20','FALSCH'],a:0,pre:[['C2','=WENN(B2>=20;"bestanden";"nicht bestanden")','C7']],explain:'20 ist nicht größer als 20. Die Prüfung ist falsch, also kommt der Sonst-Wert. Für »ab 20« braucht man <code>&gt;=</code>.'},
   {type:'formula',q:'Im Online-Shop gilt: Ab 50 € Bestellwert ist der Versand kostenlos, sonst kostet er 4,95 €. Berechne die Versandkosten in B2.',cell:'B2',expect:'=WENN(B1>=50;0;4,95)',require:['WENN'],sheet:{cells:{A1:'Bestellwert',B1:42.9,A2:'Versand',A3:'Gesamt',B3:'=B1+B2'},fmt:{B:'eur'},rows:3,cols:2,lbl:['A1','A2','A3']},hint:'Prüfung: B1&gt;=50. Dann 0, sonst 4,95. Zahlen brauchen keine Anführungszeichen.'},
   {lv:'MSA',type:'formula',q:'Ein anderer Shop staffelt den Versand: unter 20 € Bestellwert kostet er 6,95 €, unter 50 € kostet er 4,95 €, ab 50 € ist er kostenlos. Berechne die Versandkosten in B2 mit einer verschachtelten WENN-Funktion.',cell:'B2',expect:'=WENN(B1<20;6,95;WENN(B1<50;4,95;0))',require:['WENN'],sheet:{cells:{A1:'Bestellwert',B1:42.9,A2:'Versand',A3:'Gesamt',B3:'=B1+B2'},fmt:{B:'eur'},rows:3,cols:2,lbl:['A1','A2','A3']},hint:'Setze eine zweite WENN-Funktion als Sonst-Wert ein: <code>=WENN(B1&lt;20;6,95;WENN(B1&lt;50;…;…))</code>.'},
   {type:'mc',q:'Welche Formel ist richtig geschrieben?',opts:['=WENN(A2="ja";10;0)','=WENN(A2=ja;10;0)','=WENN A2="ja" DANN 10 SONST 0','=WENN(A2="ja";10)0'],a:0,sheet:false,explain:'Text wie »ja« gehört in Anführungszeichen. Die drei Teile stehen in einer Klammer und werden mit Semikolons getrennt.'}
  ]},
{ id:'diagramme', title:'Diagramme lesen und erstellen', glyph:'▮▮', badge:'Diagramm-Detektiv', ctx:'Umfrage: Wie kommst du zur Schule?',
  story:'Die 10b hat eine Umfrage gemacht: Wie kommst du zur Schule? Jetzt geht es darum, die Ergebnisse auszuwerten und gut darzustellen.',

   {type:'formula',q:'Berechne in C2 den Anteil der Busfahrer an der ganzen Klasse und ziehe die Formel bis C6. Die Summe steht in B7.',cell:'C2',fill:'C6',expect:'=B2/$B$7',acc100:true,hint:'Anteil = Teil durch Ganzes: <code>=B2/$B$7</code>. Das $ verhindert, dass B7 beim Herunterziehen verrutscht.'},
   {type:'mc',q:'Die Klasse will die Anteile auf einem Plakat zeigen. Welcher Diagrammtyp passt am besten?',opts:['Kreisdiagramm','Liniendiagramm','Streudiagramm','Gar keiner'],a:0,pre:[['C2','=B2/$B$7','C6']],explain:'Alle Kinder zusammen sind 100 %. Für Anteile eines Ganzen eignet sich das Kreisdiagramm.'},
   {type:'mc',q:'Du willst zeigen, wie sich die Temperatur in Kiel über ein Jahr entwickelt. Welcher Diagrammtyp passt?',opts:['Liniendiagramm','Kreisdiagramm','Gar keiner','Tabelle ohne Diagramm'],a:0,sheet:false,explain:'Für eine Entwicklung über die Zeit nimmt man ein Liniendiagramm.'},
   {type:'mc',q:'Der Theater-AG-Flyer zeigt dieses Diagramm. Was ist daran irreführend?',opts:['Die y-Achse beginnt bei 44 statt bei 0. So wirkt der Anstieg riesig.','Die Säulen sind falsch beschriftet.','Säulendiagramme darf man für Jahre nicht nutzen.','Es fehlt eine Legende mit Farben.'],a:0,sheet:false,chart:{labels:['2024','2025'],values:[46,52],yMin:44,yMax:53,step:1,title:'Anmeldungen Theater-AG'},explain:'Die Säule für 2025 ist viermal so hoch, aber die Anmeldungen sind nur von 46 auf 52 gestiegen.'},
   {lv:'ESA',type:'number',q:'Wie viele Anmeldungen gab es 2025 mehr als 2024?',answer:6,sheet:false,chart:{labels:['2024','2025'],values:[46,52],yMin:44,yMax:53,step:1,title:'Anmeldungen Theater-AG'},explain:'52 − 46 = 6. Das ist nur ein kleiner Anstieg, auch wenn die Säule viermal so hoch aussieht.'},
   {lv:'MSA',type:'number',q:'Um wie viel Prozent sind die Anmeldungen wirklich gestiegen? Runde auf eine Nachkommastelle.',answer:13.0,tol:0.15,unit:'%',sheet:false,chart:{labels:['2024','2025'],values:[46,52],yMin:44,yMax:53,step:1,title:'Anmeldungen Theater-AG'},explain:'Zunahme 6. Prozentsatz = 6 : 46 ≈ 0,130 = 13,0 %.'}
  ]},
{ lv:'MSA', id:'projekt', title:'Projekt: Handytarife vergleichen', glyph:'€', badge:'Tarif-Checker', ctx:'Alles zusammen: Welcher Vertrag lohnt sich?',
  story:'Elif braucht einen neuen Handyvertrag. Tarif Flex kostet 4,99 € Grundgebühr plus 1,50 € pro GB. Tarif Max ist eine Flatrate für 14,99 €. Ab wann lohnt sich welcher Tarif?',
  merke:['Feste Werte (Grundgebühr, Preis pro GB) stehen oben in eigenen Zellen und werden mit <code>$</code> festgehalten.','Formel für einen linearen Tarif: Grundgebühr + Preis pro GB · GB.','Mit WENN lässt du Excel entscheiden, welcher Tarif günstiger ist.','Ändere oben einen Preis, und die ganze Tabelle rechnet neu.'],
  ex:'B6: <b>=$B$1+$B$2*A6</b><br>D6: <b>=WENN(B6&lt;C6;"Flex";"Max")</b>',
  sheet:{cells:{A1:'Grundgebühr Flex',B1:4.99,A2:'Preis pro GB Flex',B2:1.5,A3:'Flatrate Max',B3:14.99,A5:'GB',B5:'Flex',C5:'Max',D5:'Günstiger',A6:1,A7:2,A8:3,A9:4,A10:5,A11:6,A12:7,A13:8,A14:9,A15:10},fmt:{B:'eur',C:'eur'},rows:15,cols:4,w:{A:150},lbl:['A5','B5','C5','D5']},
  tasks:[
   {type:'formula',q:'Berechne in B6 die Kosten von Tarif Flex bei 1 GB. Die Formel soll sich bis B15 herunterziehen lassen.',cell:'B6',fill:'B15',expect:'=$B$1+$B$2*A6',hint:'Grundgebühr ($B$1) plus Preis pro GB ($B$2) mal GB (A6). Nur A6 darf mitwandern.'},

   ========================================================= */
const LEVELS=[[0,'Zellen-Neuling'],[60,'Formel-Lehrling'],[150,'Bezugs-Profi'],[260,'Funktions-Fuchs'],[400,'Tabellen-Champion'],[540,NIVEAU+'-Meister']];
function levelOf(x){let i=0;LEVELS.forEach((l,j)=>{if(x>=l[0])i=j});const cur=LEVELS[i],nxt=LEVELS[i+1];return{name:cur[1],pct:nxt?(x-cur[0])/(nxt[0]-cur[0]):1,next:nxt}}
function updateHud(){const L=levelOf(ST.xp);document.getElementById('lvlName').textContent=L.name;document.getElementById('xpFill').style.width=Math.round(L.pct*100)+'%';document.getElementById('xpNum').textContent=ST.xp+' XP'}
function addXP(n){const before=levelOf(ST.xp).name;ST.xp+=n;save();updateHud();const after=levelOf(ST.xp).name;if(after!==before){toast('Neues Level: '+after);confetti()}}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function stDone(si){return STATIONS[si].tasks.filter((_,ti)=>ST.tasks[si+'-'+ti]).length}

/* =========================================================
   Konfetti
   ========================================================= */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=document.getElementById('confetti');cv.hidden=false;const ctx=cv.getContext('2d');
  cv.width=innerWidth;cv.height=innerHeight;
  const cs=getComputedStyle(document.documentElement),cols=['--accent','--mark','--bad','--good'].map(v=>cs.getPropertyValue(v).trim());
  const P=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,s:4+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)],r:Math.random()*6}));
  let f=0;(function tick(){ctx.clearRect(0,0,cv.width,cv.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.r+=.1;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});
    if(++f<110)requestAnimationFrame(tick);else{ctx.clearRect(0,0,cv.width,cv.height);cv.hidden=true}})();
}

/* =========================================================
   Diagramm (SVG)
   ========================================================= */
function barChart(c){
  const W=520,H=280,l=46,r=14,t=34,b=40,yMin=c.yMin||0,yMax=c.yMax,step=c.step||1;
  const y=v=>t+(H-t-b)*(1-(v-yMin)/(yMax-yMin));const bw=(W-l-r)/c.labels.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title)}">`;
  s+=`<text x="${l}" y="18" fill="var(--ink)" font-family="var(--f-display)" font-weight="600" font-size="15">${esc(c.title)}</text>`;
  for(let v=yMin;v<=yMax+1e-9;v+=step){s+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/><text x="${l-8}" y="${y(v)+4}" text-anchor="end" fill="var(--muted)" font-family="var(--f-mono)" font-size="11">${v}</text>`}
  c.values.forEach((v,i)=>{const x=l+i*bw+bw*.2,w=bw*.6;s+=`<rect x="${x}" y="${y(v)}" width="${w}" height="${y(yMin)-y(v)}" fill="var(--accent)" rx="2"/>`;
    s+=`<text x="${x+w/2}" y="${H-b+18}" text-anchor="middle" fill="var(--ink)" font-size="12.5" font-family="var(--f-body)">${esc(c.labels[i])}</text>`});
  s+=`<line x1="${l}" x2="${W-r}" y1="${y(yMin)}" y2="${y(yMin)}" stroke="var(--muted)" stroke-width="1.2"/></svg>`;
  return `<div class="chart">${s}</div>`;
}

function buildCells(sheet,pre){
  let c=Object.assign({},sheet.cells);
  (pre||[]).forEach(([cell,f,to])=>{c=place(c,to?rangeCells(cell,to):[cell],f)});
  return c;
}
function sheetWidget(o){
  // o: {sheet, cells, mode:'view'|'formula'|'click', target, fill, inputId, value, onEnter, onInput, onPick, picked}
  const sh=o.sheet,root=document.createElement('div');root.className='sheet';

    const bar=document.createElement('div');bar.className='fbar';
    bar.innerHTML=`<span class="namebox">${o.target}</span><span class="fx">fx</span>`;

    const h=document.createElement('span');h.className='hint';h.textContent='Klick auf eine Zelle fügt ihre Adresse ein';keys.appendChild(h);

    input.addEventListener('input',()=>{if(input.value&&input.value[0]!=='='&&/^[A-Za-z(]/.test(input.value)===false){} overlay=null;render();o.onInput&&o.onInput(input.value)});
    input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();o.onEnter&&o.onEnter()}});
  }
  function insert(txt){if(!input)return;const s=input.selectionStart??input.value.length,e=input.selectionEnd??s;input.value=input.value.slice(0,s)+txt+input.value.slice(e);const p=s+txt.length;input.focus();input.setSelectionRange(p,p);overlay=null;render();o.onInput&&o.onInput(input.value)}
  const gw=document.createElement('div');gw.className='gridwrap';root.appendChild(gw);

    else if(input&&input.value.trim()){const f=normFormula(input.value);if(f[0]==='='){cells=place(cells,[targets[0]],f);prevAt=targets[0]}else{cells=Object.assign({},cells,{[targets[0]]:f});prevAt=targets[0]}}
    const get=makeEval(cells);
    const refs=new Set();

    const selCol=targets.length?parseAddr(targets[0]).c:(picked?parseAddr(picked).c:0),selRow=targets.length?parseAddr(targets[0]).r:(picked?parseAddr(picked).r:0);
    let h=`<table class="g${o.mode==='click'?' clickable':''}"><thead><tr><th class="rh"></th>`;
    for(let c=1;c<=cols;c++){const L=numToCol(c),w=(sh.w&&sh.w[L])||(c===1?120:96);h+=`<th style="min-width:${w}px"${c===selCol?' class="on"':''}>${L}</th>`}
    h+='</tr></thead><tbody>';
    for(let r=1;r<=rows;r++){
      h+=`<tr><th class="rh${r===selRow?' on':''}">${r}</th>`;
      for(let c=1;c<=cols;c++){
        const a=addrOf(c,r),raw=cells[a];let v=get(a);
        if(o.mode==='formula'&&targets.includes(a)&&!overlay&&a!==prevAt)v=null;
        const f=(sh.fmt&&(sh.fmt[a]||sh.fmt[numToCol(c)]))||'';

  });
  gw.addEventListener('click',e=>{const td=e.target.closest('td');if(!td)return;if(o.mode==='click'&&!o.locked){picked=td.dataset.a;render();o.onPick&&o.onPick(picked)}});
  if(input)input.addEventListener('focus',render),input.addEventListener('blur',render);
  render();
  return{el:root,input,
    showFill(formula,m){overlay=formula;marks=m||{};render()},
    clearFill(){overlay=null;marks={};render()},
    setPicked(a){picked=a;render()},
    lock(){o.locked=true;if(input)input.readOnly=true},
    get value(){return input?input.value:picked}};
}

/* =========================================================
   Bewertung
   ========================================================= */
function perturb(cells,skip){
  const o=Object.assign({},cells);
  for(const k in o){const v=o[k];if(typeof v!=='number'||skip.includes(k))continue;let n;
    if(v===0){o[k]=Math.floor(Math.random()*9)+1;continue}
    do{if(Number.isInteger(v)&&Math.abs(v)>=2)n=v+(Math.floor(Math.random()*7)+1)*(Math.random()<.5?-1:1);
       else if(Math.abs(v)<1)n=Math.round(v*(0.5+Math.random())*1000)/1000;
       else n=Math.round(v*(0.6+Math.random()*0.8)*100)/100}while(n===v||n===0);
    o[k]=n}
  return o;
}
function gradeFormula(task,base,input){
  const f=normFormula(input);
  if(!f)return{ok:false,msg:'Tippe zuerst eine Formel in die Bearbeitungsleiste.'};
  if(f[0]!=='=')return{ok:false,msg:'Eine Formel beginnt immer mit einem Gleichheitszeichen <code>=</code>.'};
  try{parse(f.slice(1))}catch(e){return{ok:false,msg:'Die Formel ist so nicht vollständig. Prüfe Klammern, Semikolons und Anführungszeichen.'}}
  const targets=task.fill?rangeCells(task.cell,task.fill):[task.cell];
  const ev=(cells,frm)=>{const g=makeEval(place(cells,targets,frm));return targets.map(g)};
  const sv=ev(base,f),rv=ev(base,task.expect);
  const errV=sv.find(isErr);
  const cmp=targets.map((_,i)=>same(sv[i],rv[i],task.acc100));
  const marks={};targets.forEach((t,i)=>marks[t]=cmp[i]?'ok':'bad');
  if(!cmp.every(Boolean)){
    if(errV&&!cmp[0])return{ok:false,msg:ERRTXT[errV.err]||'Die Formel liefert einen Fehler.',marks};
    if(cmp[0]&&targets.length>1)return{ok:false,msg:'Die erste Zeile stimmt, aber beim Herunterziehen verrutscht ein Bezug (rote Zellen). Welcher Bezug muss mit <code>$</code> festgehalten werden?',marks};
    return{ok:false,msg:'Das Ergebnis stimmt noch nicht. '+(task.hint?'Tipp: '+task.hint:''),marks,weak:true};
  }
  for(let k=0;k<3;k++){const pc=perturb(base,targets);const a=ev(pc,f),b=ev(pc,task.expect);
    if(!targets.every((_,i)=>same(a[i],b[i],task.acc100)))return{ok:false,msg:'Das Ergebnis stimmt nur für diese Zahlen. Verwende Zellbezüge (z. B. <code>B2</code>) statt fest eingetippter Zahlen und prüfe, ob die Bezüge auf die richtigen Zellen zeigen.',marks}}
  if(task.require){for(const fn of task.require){const alias=Object.keys(ALIAS).filter(k=>ALIAS[k]===fn);const names=[fn,...alias];
    if(!names.some(n=>new RegExp('(^|[^A-ZÄÖÜ])'+n.replace('.','\\.')+'\\s*\\(','i').test(f)))return{ok:false,msg:`Das Ergebnis stimmt! Übe hier aber die Funktion <code>${fn}</code> und baue sie in deine Formel ein.`,marks}}}
  return{ok:true,marks};
}
function numAnswer(task,cells){if(typeof task.answer==='string'&&task.answer[0]==='=')return makeEval(place(cells||{},['ZZ99'],task.answer))('ZZ99');return task.answer}
function gradeNumber(task,cells,input){
  const n=parseNum(input);if(n===null)return{ok:false,msg:'Gib eine Zahl ein, z. B. <code>12,5</code>.'};
  const ans=numAnswer(task,cells),tol=task.tol??0.011;
  return Math.abs(n-ans)<=tol?{ok:true}:{ok:false,msg:'Das stimmt noch nicht. Rechne noch einmal nach.'};
}

const TYPELBL={formula:'Formel eingeben',mc:'Auswählen',number:'Zahl eingeben',click:'Zelle anklicken'};
const ORDER={};
function optOrder(key,n){if(!ORDER[key])ORDER[key]=shuffle([...Array(n).keys()]);return ORDER[key]}
function taskView(task,ctx){
  // ctx: {key, station, mode:'learn'|'test', solved, stored, onSolved(xp), onAnswer(val)}
  const card=document.createElement('div');card.className='task';
  const sheetDef=task.sheet===false?null:(task.sheet||(ctx.station&&ctx.station.sheet)||null);
  const cells=sheetDef?buildCells(sheetDef,task.pre):{};
  const learn=ctx.mode==='learn';
  let attempts=0,revealed=false,solved=!!ctx.solved;
  card.innerHTML=`<div class="task-meta">${ctx.meta||''}<span class="chip">${TYPELBL[task.type]}</span>${learn?`<span class="chip xp">${solved?'erledigt':'+10 XP'}</span>`:''}</div><h3>${task.q}</h3>`;
  if(task.chart)card.insertAdjacentHTML('beforeend',barChart(task.chart));
  let widget=null,getAnswer=()=>null;
  if(task.type==='formula'){
    widget=sheetWidget({sheet:sheetDef,cells,mode:'formula',target:task.cell,fill:task.fill,inputId:'in-'+ctx.key,value:solved&&learn?ctx.stored||task.expect:(ctx.stored||''),onEnter:()=>check(),onInput:v=>{if(widget)widget.clearFill&&0;ctx.onAnswer&&ctx.onAnswer(v)}});
    card.appendChild(widget.el);getAnswer=()=>widget.value;
    if(task.fill)card.insertAdjacentHTML('beforeend',`<p class="muted" style="font-size:.88rem;margin-top:-6px">Beim Prüfen wird deine Formel von ${task.cell} bis ${task.fill} heruntergezogen (gestreifte Zellen).</p>`);
  }else if(task.type==='click'){
    widget=sheetWidget({sheet:sheetDef,cells,mode:'click',picked:ctx.stored||(solved&&learn?task.answer:null),onPick:a=>{ctx.onAnswer&&ctx.onAnswer(a)}});
    card.appendChild(widget.el);getAnswer=()=>widget.value;
  }else{
    if(sheetDef)card.appendChild(sheetWidget({sheet:sheetDef,cells,mode:'view'}).el);
  }
  let selIdx=ctx.stored??null,optBtns=[];
  if(task.type==='mc'){
    const box=document.createElement('div');box.className='opts';box.setAttribute('role','group');
    const ord=optOrder(ctx.key,task.opts.length);
    ord.forEach((oi,k)=>{const b=document.createElement('button');b.type='button';b.className='opt';b.dataset.i=oi;
      const isCode=task.opts[oi].trim().startsWith('=');
      b.innerHTML=`<span class="k">${'ABCD'[k]}</span><span>${isCode?`<code>${esc(task.opts[oi])}</code>`:esc(task.opts[oi])}</span>`;
      b.onclick=()=>{if(solved&&learn)return;selIdx=oi;optBtns.forEach(x=>x.classList.toggle('sel',+x.dataset.i===oi));ctx.onAnswer&&ctx.onAnswer(oi);if(learn)check()};
      optBtns.push(b);box.appendChild(b)});
    card.appendChild(box);getAnswer=()=>selIdx;
    if(selIdx!==null)optBtns.forEach(x=>x.classList.toggle('sel',+x.dataset.i===selIdx));
  }
  let numIn=null;
  if(task.type==='number'){
    const w=document.createElement('div');w.className='numin';
    w.innerHTML=`<input id="num-${ctx.key}" inputmode="decimal" autocomplete="off" aria-label="Antwort" placeholder="Antwort"><span class="muted">${task.unit||''}</span>`;
    numIn=w.querySelector('input');numIn.value=ctx.stored??(solved&&learn?String(numAnswer(task,cells)).replace('.',','):'');
    numIn.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check()}});
    numIn.addEventListener('input',()=>ctx.onAnswer&&ctx.onAnswer(numIn.value));
    card.appendChild(w);getAnswer=()=>numIn.value;
  }
  const fb=document.createElement('div');fb.setAttribute('role','status');card.appendChild(fb);
  function say(kind,html){fb.innerHTML=html?`<div class="fb ${kind}"><span class="ic">${kind==='ok'?'✓':kind==='no'?'!':'i'}</span><div>${html}</div></div>`:''}
  const acts=document.createElement('div');acts.className='actions';
  if(learn){
    if(task.type!=='mc'){const cb=document.createElement('button');cb.className='btn primary';cb.type='button';cb.textContent='Prüfen';cb.onclick=check;acts.appendChild(cb)}
    if(task.hint){const hb=document.createElement('button');hb.className='btn ghost';hb.type='button';hb.textContent='Tipp';hb.onclick=()=>say('tip',task.hint);acts.appendChild(hb)}
    const sb=document.createElement('button');sb.className='btn ghost';sb.type='button';sb.textContent='Lösung zeigen';sb.hidden=true;sb.onclick=()=>{revealed=true;showSolution();finish(0)};acts.appendChild(sb);card._sol=sb;
    acts.insertAdjacentHTML('beforeend','<span class="sp"></span>');
    const nb=document.createElement('button');nb.className='btn';nb.type='button';nb.textContent=ctx.last?'Station abschließen':'Weiter →';nb.hidden=!solved;nb.onclick=()=>ctx.onNext&&ctx.onNext();acts.appendChild(nb);card._next=nb;
    card.appendChild(acts);
  }
  function showSolution(){
    if(task.type==='formula'){widget.input.value=task.expect;const g=gradeFormula(task,cells,task.expect);widget.showFill(task.expect,g.marks);say('tip','Lösung: <code>'+esc(task.expect)+'</code>'+(task.explain?' '+task.explain:''))}
    else if(task.type==='click'){widget.setPicked(task.answer);say('tip','Lösung: '+task.answer+'. '+(task.explain||''))}
    else if(task.type==='mc'){optBtns.forEach(x=>x.classList.toggle('right',+x.dataset.i===task.a));say('tip',task.explain||'')}
    else if(task.type==='number'){numIn.value=String(+numAnswer(task,cells).toFixed(2)).replace('.',',');say('tip','Lösung: '+numIn.value+' '+(task.unit||'')+'. '+(task.explain||''))}
  }
  function grade(){
    const v=getAnswer();
    if(task.type==='formula')return gradeFormula(task,cells,v);
    if(task.type==='number')return gradeNumber(task,cells,v);
    if(task.type==='mc')return v===null?{ok:false,msg:'Wähle eine Antwort.'}:(v===task.a?{ok:true}:{ok:false,msg:'Leider falsch. Lies die Frage noch einmal genau.'});
    if(task.type==='click')return !v?{ok:false,msg:'Klicke auf eine Zelle.'}:(v===task.answer?{ok:true}:{ok:false,msg:`Du hast ${v} angeklickt. Das ist nicht die gesuchte Zelle.`});
  }
  function check(){
    if(solved&&learn){return}
    const g=grade();
    if(task.type==='formula'&&g.marks&&task.fill)widget.showFill(normFormula(getAnswer()),g.marks);
    else if(task.type==='formula'&&g.ok)widget.showFill(normFormula(getAnswer()),{});
    if(g.ok){
      if(task.type==='mc')optBtns.forEach(x=>{x.classList.toggle('right',+x.dataset.i===task.a);x.disabled=true});
      const xp=attempts===0?10:5;
      say('ok',`<b>Richtig! +${xp} XP</b>${task.explain?' '+task.explain:''}`);card.classList.add('pop');
      finish(xp);
    }else{
      attempts++;
      if(task.type==='mc')optBtns.forEach(x=>{if(+x.dataset.i===selIdx){x.classList.add('wrong');x.disabled=true}});
      say('no',g.msg);card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
      if(attempts>=2&&card._sol)card._sol.hidden=false;
    }
  }
  function finish(xp){
    solved=true;if(widget&&widget.lock)widget.lock();if(numIn)numIn.readOnly=true;
    optBtns.forEach(x=>x.disabled=true);
    if(card._sol)card._sol.hidden=true;if(card._next)card._next.hidden=false;
    const chip=card.querySelector('.chip.xp');if(chip)chip.textContent=xp?`+${xp} XP`:'gelöst mit Hilfe';
    ctx.onSolved&&ctx.onSolved(xp,getAnswer());
    card._next&&card._next.focus({preventScroll:true});
  }
  if(solved&&learn){
    if(task.type==='formula'){const f=normFormula(widget.value);widget.showFill(f,{});widget.lock()}
    if(task.type==='mc')optBtns.forEach(x=>{x.classList.toggle('right',+x.dataset.i===task.a);x.disabled=true});
    if(numIn)numIn.readOnly=true;if(widget&&widget.lock)widget.lock();
    say('ok','Schon gelöst. '+(task.explain||''));
  }
  card.grade=grade;card.showSolution=showSolution;card.cells=cells;
  return card;
}

      <p class="muted" style="margin-top:12px;max-width:40em">16 Aufgaben aus allen acht Stationen, je zwei pro Thema, in zufälliger Auswahl. Wie in der Prüfung gibt es unterwegs keine Tipps. Erst am Ende siehst du, was richtig war, und bekommst eine Empfehlung, was du noch üben solltest.</p>
      <div class="actions" style="margin-top:20px"><button class="btn primary" id="startT" type="button">Test starten</button><a class="btn" href="#start">Erst noch üben</a></div></div>
      <div class="card"><h3>Gut zu wissen</h3><ul><li>Formeln mit deutschen Funktionsnamen und Semikolon, z. B. <code>=WENN(A1&gt;5;"ja";"nein")</code>.</li><li>Du kannst zwischen den Aufgaben vor- und zurückspringen.</li><li>Pro richtiger Antwort gibt es 5 XP, ab 80 % das Abzeichen »Testsieger«.</li>${ST.test.best!==null?`<li>Dein bisheriger Bestwert: <b>${ST.test.best} %</b>.</li>`:''}</ul></div></div>`;
    document.getElementById('startT').onclick=()=>{newRun();RUN.started=true;renderTest()};
    return;
  }
  if(RUN.done)return renderResults();
  const it=RUN.items[RUN.idx],n=RUN.items.length;
  app.innerHTML=`<div class="tprog" aria-hidden="true">${RUN.items.map((_,i)=>`<i class="${i===RUN.idx?'cur':RUN.ans[i]!==null&&RUN.ans[i]!==''?'ans':''}"></i>`).join('')}</div><div id="tq"></div>
  <div class="actions" style="margin-top:16px"><button class="btn" id="prevQ" type="button" ${RUN.idx===0?'disabled':''}>← Zurück</button><span class="sp"></span><span class="muted" style="font-size:.9rem">${RUN.ans.filter(a=>a!==null&&a!=='').length} von ${n} beantwortet</span><button class="btn primary" id="nextQ" type="button">${RUN.idx===n-1?'Test abgeben':'Weiter →'}</button></div>`;
  const card=taskView(it.t,{key:'t'+RUN.id+'-'+RUN.idx,mode:'test',stored:RUN.ans[RUN.idx],meta:`<span class="chip">Frage ${RUN.idx+1} von ${n}</span><span class="chip">${STATIONS[it.si].title}</span>`,onAnswer:v=>{RUN.ans[RUN.idx]=v}});
  document.getElementById('tq').appendChild(card);
  document.getElementById('prevQ').onclick=()=>{RUN.idx--;renderTest()};
  document.getElementById('nextQ').onclick=()=>{
    if(RUN.idx<n-1){RUN.idx++;renderTest();window.scrollTo({top:0})}
    else{const open=RUN.ans.filter(a=>a===null||a==='').length;
      if(open&&!RUN.confirm){RUN.confirm=true;const b=document.getElementById('nextQ');b.textContent=`Trotzdem abgeben (${open} offen)`;return}
      finishRun()}
  };
}
function finishRun(){
  RUN.res=RUN.items.map((it,i)=>{const t=it.t,cells=t.sheet?buildCells(t.sheet,t.pre):{};const a=RUN.ans[i];
    if(a===null||a==='')return false;
    if(t.type==='formula')return gradeFormula(t,cells,a).ok;
    if(t.type==='number')return gradeNumber(t,cells,a).ok;
    if(t.type==='mc')return a===t.a;
    if(t.type==='click')return a===t.answer;});
  RUN.done=true;
  const right=RUN.res.filter(Boolean).length,pct=Math.round(right/RUN.items.length*100);
  ST.test.runs++;ST.test.best=Math.max(ST.test.best??0,pct);
  const gain=right*5;save();addXP(gain);
  if(pct>=80&&!ST.badges.test){ST.badges.test=true;save();addXP(30);toast('Abzeichen »Testsieger« freigeschaltet! +30 XP')}
  if(pct>=80)setTimeout(confetti,300);
  renderTest();window.scrollTo({top:0});
}
function answerText(t,a,cells){
  if(a===null||a==='')return'<span class="muted">keine Antwort</span>';
  if(t.type==='mc')return t.opts[a].startsWith('=')?`<code>${esc(t.opts[a])}</code>`:esc(t.opts[a]);
  if(t.type==='formula')return`<code>${esc(a)}</code>`;
  return esc(a)+(t.unit?' '+t.unit:'');
}
function correctText(t,cells){
  if(t.type==='mc')return t.opts[t.a].startsWith('=')?`<code>${esc(t.opts[t.a])}</code>`:esc(t.opts[t.a]);
  if(t.type==='formula')return`<code>${esc(t.expect)}</code>`;
  if(t.type==='click')return t.answer;
  return String(+(+numAnswer(t,cells)).toFixed(2)).replace('.',',')+(t.unit?' '+t.unit:'');
}
function renderResults(){
  const n=RUN.items.length,right=RUN.res.filter(Boolean).length,pct=Math.round(right/n*100);
  const msg=pct>=90?'Herausragend. Du bist bereit für die Prüfung.':pct>=75?'Stark! Ein paar Kleinigkeiten noch, dann sitzt alles.':pct>=50?'Solide Grundlage. Schau dir die markierten Themen noch einmal an.':'Da geht noch was. Arbeite die empfohlenen Stationen durch und versuch es dann noch einmal.';
  const per=STATIONS.map((st,si)=>({st,si,r:RUN.items.map((it,i)=>it.si===si?RUN.res[i]:null).filter(x=>x!==null)}));
  app.innerHTML=`<div class="task" style="gap:20px">
    <div class="score"><div class="big">${right}<small> / ${n}</small></div><div style="flex:1;min-width:220px"><h2 style="font-size:1.5rem">${pct} % richtig</h2><p class="muted" style="margin-top:6px">${msg} Du bekommst ${right*5} XP.</p></div></div>
    <div><h3 style="font-family:var(--f-display);font-size:1.1rem">Deine Themen</h3><div class="topics">${per.map(p=>`<div class="topic"><span>${p.si+1} · ${p.st.title}</span><span class="dots">${p.r.map(x=>`<i class="${x?'y':''}"></i>`).join('')}</span><span>${p.r.every(Boolean)?'<span class="muted" style="font-size:.85rem">sitzt</span>':`<a href="#station-${p.si+1}" style="font-weight:700;font-size:.9rem">üben</a>`}</span></div>`).join('')}</div></div>
    <div class="actions"><button class="btn primary" id="again" type="button">Neuen Test starten</button><a class="btn" href="#start">Zum Lernpfad</a></div>
  </div>
  <div class="sec-head" style="margin-top:28px"><h2>Alle Aufgaben mit Lösung</h2></div>
  <div class="review">${RUN.items.map((it,i)=>{const t=it.t,cells=t.sheet?buildCells(t.sheet,t.pre):{};const ok=RUN.res[i];
    return `<details${ok?'':' open'}><summary><span class="m ${ok?'y':'n'}">${ok?'✓':'✗'}</span><span>Frage ${i+1}: ${STATIONS[it.si].title}</span></summary><div class="body"><div>${t.q}</div><div>Deine Antwort: ${answerText(t,RUN.ans[i],cells)}</div><div>Richtig: <b>${correctText(t,cells)}</b></div>${t.explain?`<div class="muted">${t.explain}</div>`:''}</div></details>`}).join('')}</div>`;
  document.getElementById('again').onclick=()=>{newRun();RUN.started=true;renderTest();window.scrollTo({top:0})};
}

/* ---------- Router ---------- */
function route(){
  const h=location.hash.slice(1);let m;
  if((m=/^station-(\d+)$/.exec(h)))renderStation(+m[1]-1);
  else if(h==='test')renderTest();
  else renderHome();
}
addEventListener('hashchange',()=>{route();window.scrollTo({top:0})});
updateHud();route();
</script>
</body></html>
